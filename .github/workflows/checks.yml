name: Developer preview checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows source, unit and Electron fixtures
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download the locked Electron desktop runtime
        run: node node_modules/electron/install.js
      - name: Check the public source surface
        run: npm run check:source
      - name: Check selected desktop prerequisites
        run: npm run doctor
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Unit and Electron checks with synthetic services
        run: npm run check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the CPU regression dependency
        run: python -m pip install numpy==2.2.6
      - name: Backend retention and lifecycle fixtures
        run: python -m unittest discover -s runtime/voicegen-oui/backend -p test_speech_sessions.py
      # Test profiles and recordings remain on the ephemeral runner.
      # No provider secrets, model weights, WSL or artifact uploads are used.
